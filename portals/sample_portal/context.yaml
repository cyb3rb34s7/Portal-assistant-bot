# Portal context file for the sample portal shipped in sample_portal/.
# Used by the agent's planner stage to ground its reasoning about goals
# expressed in natural language.
#
# Schema: pilot/agent/schemas/portal_context.py :: PortalContext

schema_version: 1

portal_id: sample_portal
name: "CurationPilot Sample Portal"
base_url: "http://localhost:5188"
external_llm_enabled: true

glossary:
  - term: "asset"
    meaning: >
      A piece of media tracked by a stable identifier of the form
      A-NNNN, B-NNNN, etc. Each asset has a title, categories
      (multi-select), tags (multi-select), and a publishing region.
    aliases: ["content", "item"]

  - term: "category"
    meaning: >
      A coarse classification like Sports, News, Entertainment.
      Assets can have multiple categories; the catalog filter is
      by single category.

  - term: "region / market / language"
    meaning: >
      Cascading geographic and locale taxonomy. Region (Americas,
      EMEA, APAC) determines Market (US, GB, IN, etc.). Market
      determines Language (en-US, en-GB, hi-IN, etc.). Each asset
      is published to one region+market+language combination.

  - term: "workflow"
    meaning: >
      An asset moves: draft -> in_review -> (approved | back to draft
      via reject) -> published. Each transition is a separate API
      call with its own idempotency key.

  - term: "layout / slot / curation"
    meaning: >
      Legacy curation flow (still supported). Pick one of three
      layouts (grid-2x2, featured-row, carousel), fill its slots with
      uploaded CSV contents + images, save + apply.

page_map:
  - path: "/login"
    role: "auth"
    notes: >
      Single-page login. Any non-empty username + password authenticates.
      The auth_signal probe looks for nav-user-menu after login.

  - path: "/catalog"
    role: "primary_workflow"
    notes: >
      Asset search + filter. Search field is substring-like, so a partial
      query (e.g. "A-90") can return multiple results -- the multi-result
      disambiguation scenario.

  - path: "/asset/:id"
    role: "primary_workflow"
    notes: >
      Asset edit form. Cascading dropdowns (region -> market -> language)
      and multi-select (categories, tags). Workflow buttons are
      state-gated (Submit only on draft, Approve/Reject only on
      in_review, Publish only on approved).

  - path: "/upload"
    role: "intake"
    notes: >
      CSV upload tab (legacy curation flow).

  - path: "/curation"
    role: "primary_workflow"
    notes: >
      Legacy curation flow.

field_conventions:
  - field: "asset_id"
    format: "letter-NNNN"
    examples: ["A-9001", "B-2001", "D-4002"]
    aliases: ["content_id", "id"]

  - field: "region"
    format: "one of: AMER, EMEA, APAC"
    examples: ["AMER", "EMEA", "APAC"]

  - field: "market"
    format: "ISO-2 country code"
    examples: ["US", "GB", "IN", "JP"]

  - field: "language"
    format: "IETF language tag"
    examples: ["en-US", "hi-IN", "ja-JP"]

  - field: "publish_at"
    format: "YYYY-MM-DD"
    timezone: "UTC"

  - field: "layout_id"
    format: "one of: grid-2x2, featured-row, carousel"
    examples: ["grid-2x2", "featured-row", "carousel"]

destructive_actions:
  - "submit_review"  # changes asset state, gates further editing
  - "approve"        # changes asset state
  - "reject"         # changes asset state, allows re-edit
  - "publish"        # irreversible -- makes the asset live
  - "save_layout"    # legacy curation
  - "apply_layout"   # legacy curation

session:
  login_url: "/login"
  session_duration_minutes: 60
  sso_provider: "none"
  notes: >
    Bearer-token auth via /api/auth/login. Token stored in
    sessionStorage. /api/auth/me probes session validity.

auth_signal:
  # Pre-flight phase probes for these. The nav-user-menu only renders
  # when authenticated; the login form only renders when not.
  logged_in_when_visible:
    - "[data-testid='nav-user-menu']"
  logged_out_when_visible:
    - "[data-testid='login-form']"
  probe_timeout_ms: 4000

# Portal-level network ignore -- the runner's expected_signals waits
# treat any URL matching these as "noise" and don't include them in
# in-flight checks. Empty for now since the sample portal has no
# long-poll / SSE channels; included as documentation of the field.
network_ignore: []

# WI-04: idempotency capability. The sample portal's mock backend has
# an Idempotency-Key middleware that dedupes within a 60s window. We
# declare the capability here so the runner injects keys on PATCH /
# POST against the destructive endpoints. body_hash is included so
# two PATCH /api/assets/A-9001 calls with different bodies get
# different keys (legitimate distinct edits don't dedupe).
idempotency:
  enabled: true
  header_name: "Idempotency-Key"
  endpoint_patterns:
    - "/api/assets/"
    - "/api/save"
    - "/api/apply"
  method_patterns: ["POST", "PUT", "PATCH", "DELETE"]
  key_components: ["session", "step_index", "method", "url_path", "body_hash"]
  body_hash_fields: []   # hash the whole body
  allow_existing_header: false
